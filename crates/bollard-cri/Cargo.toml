[package]
name = "bollard-cri"
version = "0.1.0"
edition = "2021"
authors = ["Rusternetes Contributors"]
license = "Apache-2.0"
description = "A CRI server for Docker/Podman over the Docker Engine API (bollard) — the cri-dockerd shape in Rust"
repository = "https://github.com/rusternetes/rusternetes"

# NOTE: depends on cri-proto/cri-server + bollard only — never on the kubelet
# or other rusternetes-* crates (plan/03-bollard-cri.md).

[dependencies]
cri-proto = { version = "0.1.0", path = "../cri-proto" }
cri-server = { version = "0.1.0", path = "../cri-server" }
bollard = "0.17"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
