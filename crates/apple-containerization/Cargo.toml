[package]
name = "apple-containerization"
version = "0.1.0"
edition = "2021"
authors = ["Rusternetes Contributors"]
license = "Apache-2.0"
description = "Host-side client for the rusternetes VMM broker's pod protocol — one microVM per Kubernetes pod on macOS"
repository = "https://github.com/rusternetes/rusternetes"
keywords = ["macos", "virtualization", "container", "kubernetes", "cri"]
categories = ["api-bindings", "virtualization"]

# NOTE: this crate must not depend on any rusternetes-* crate, nor on cri-proto /
# cri-server. It is a client for the VMM broker's protocol and nothing else;
# apple-cri is what joins it to CRI. Same layering rule as cri-proto.

[dependencies]
tokio = { version = "1.40", features = ["net", "sync", "io-util", "macros", "rt", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
# Only used by the `testing` module's fake broker, which needs a temp dir for
# its unix socket.
tempfile = { version = "3", optional = true }

[features]
# Exposes the in-process fake broker so downstream crates (apple-cri) can test
# the CRI translation without a hypervisor.
testing = ["dep:tempfile"]

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
tempfile = "3"
